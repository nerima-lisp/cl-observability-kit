name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create the GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep the tag and all ASDF system versions synchronized.
      - name: Verify tag matches .asd version
        env:
          PACKAGE: cl-observability-kit
        run: |
          set -euo pipefail
          versions="$(perl -ne 'print "$1\n" if /^\s*:version\s+"([^"]+)"/' "$PACKAGE.asd" | sort -u)"
          if [[ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 || -z "$versions" ]]; then
            echo "::error::$PACKAGE.asd declares disagreeing versions: $(echo $versions)" >&2
            exit 1
          fi
          asd_version="$versions"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "asd=$asd_version tag=$tag_version"
          if [[ "$asd_version" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $PACKAGE.asd version $asd_version" >&2
            exit 1
          fi

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Verify the tagged tree
        run: nix flake check --print-build-logs

      # Keep the release as a draft until the maintainer supplies the changelog.
      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
