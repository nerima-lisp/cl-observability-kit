name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep one GitHub job: nix flake check schedules declared checks together and
  # shares build cache. Add jobs only for work outside the Nix sandbox.
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # nix flake check runs the suite, formatting gate, and strict documentation
      # build. Do not pass --all-systems: Linux cannot build the Darwin derivations.
      - name: Check flake
        run: nix flake check --print-build-logs

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check
